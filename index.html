<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis Cuentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: tablero de escritorio en dos columnas (resumen + carga a la izquierda, pestañas a la derecha); en pantallas chicas, una sola */
:root{
  --bg:#f3f5f2; --card:#fff; --ink:#18231f; --muted:#5f6d67; --line:#dde3df;
  --accent:#1f5f4a; --accent-ink:#fff;
  --in:#1d7a46; --in-bg:#e3f2e8; --out:#b3402f; --out-bg:#f8e5e1;
  --verde:#2e9e5b; --amarillo:#c99700; --rojo:#d64533; --pagado-bg:#e3f4e8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101614; --card:#18201d; --ink:#e7eeea; --muted:#94a39c; --line:#2a3531;
  --accent:#4fb08c; --accent-ink:#0c1512;
  --in:#5cc98a; --in-bg:#15291e; --out:#f0806e; --out-bg:#311a16;
  --verde:#4cc07e; --amarillo:#f2c230; --rojo:#f06a57; --pagado-bg:#173222; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1240px;margin:0 auto;padding:18px 20px 6px}
h1{font-family:var(--f-display);font-size:1.7rem;margin:0}
.libros{flex:0 1 320px}.libros button{padding:10px 14px;font-size:.95rem}
.who{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem}
main{max-width:1240px;margin:0 auto;padding:10px 20px 40px;display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:20px;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.big{font-size:2.2rem;line-height:1.1}
.hero small{opacity:.9}
.heromes{display:flex;align-items:center;gap:6px}
.heromes button{border:0;background:rgba(255,255,255,.15);color:inherit;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:1rem}
.meter{height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}.meter b{display:block;height:100%;background:var(--accent-ink);width:0}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quad div{display:flex;flex-direction:column}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.box h2{margin:0;font:700 1.05rem var(--f-display)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 6px;font:600 .88rem var(--f-body);cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--card)}
label{font-size:.8rem;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px}
label.chk{flex-direction:row;align-items:center;gap:8px;font-size:.9rem;color:var(--ink)}
label.chk input{width:auto}
input,select{font:500 1rem var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
input.amount{font-family:var(--f-num);font-size:1.25rem}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px 12px;font:600 .85rem var(--f-body);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.del{color:var(--out)}
.err{color:var(--out);font-size:.85rem;min-height:1em}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px 8px;border-radius:9px;font:600 .9rem var(--f-body);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink)}
.month{display:flex;align-items:center;gap:4px;align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.month span{font-weight:600;min-width:130px;text-align:center;text-transform:capitalize}
.list{display:flex;flex-direction:column;gap:8px}
.day{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:8px 2px 0}
.row.pagado{background:var(--pagado-bg)}
.row{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--franja);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.acts{grid-column:1/-1;justify-content:flex-end}}
.txt{min-width:0}.c{font-weight:600;overflow-wrap:anywhere}.s{font-size:.82rem;color:var(--muted)}
.vence{font-size:.82rem;font-weight:700;color:var(--franja)}
.amt.ingreso{color:var(--in)}.amt.egreso{color:var(--out)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.bar{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:.9rem}
.bar i{grid-column:1/-1;height:8px;border-radius:4px;background:var(--out-bg);overflow:hidden;display:flex}.bar i b{display:block;height:100%;background:var(--out)}.bar i b.falta{opacity:.35}
.bar small{grid-column:1/-1;color:var(--muted);font-size:.78rem}
.bar .nom{display:flex;align-items:center;gap:8px;font-weight:600}
.btn.mas{width:28px;height:28px;padding:0;border-radius:8px;font-size:1rem;line-height:1}
.detalle{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.resumenes{display:flex;flex-direction:column;gap:12px}
.timeline{display:flex;flex-direction:column}
.tl{position:relative;padding:0 0 14px 24px;border-left:2px solid var(--line);margin-left:6px}
.tl:last-child{border-left-color:transparent}
.tl::before{content:"";position:absolute;left:-8px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--c)}
.tltop{display:flex;justify-content:space-between;gap:10px}.tlf{font-weight:700;color:var(--c)}
.bar.in i{background:var(--in-bg)}.bar.in i b{background:var(--in)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.login{max-width:420px;margin:12vh auto;padding:0 20px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.login p{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <h1>Mis Cuentas</h1>
  <p>Entrá con la misma cuenta de Google que usás en el celular para ver tus ingresos, egresos, pendientes y fijos.</p>
  <button class="btn pri" id="entrar">Entrar con Google</button>
  <div class="err" id="lerr"></div>
</div>

<div id="app" hidden>
  <header>
    <h1>Mis Cuentas</h1>
    <div class="seg libros" id="libros"></div>
    <div class="who"><span id="email"></span><button class="btn" id="salir">Salir</button></div>
  </header>
  <main>
    <div class="col">
      <section class="hero">
        <div class="heromes"><button type="button" id="hprev" aria-label="Mes anterior">‹</button><span class="lbl" id="hlbl">Resultado del mes</span><button type="button" id="hnext" aria-label="Mes siguiente">›</button></div>
        <div class="big num" id="tcomp">$ 0</div>
        <div class="quad">
          <div><span class="lbl">Ya pagado</span><span class="num" id="tout"></span></div>
          <div><span class="lbl">Falta pagar</span><span class="num" id="tdue"></span></div>
        </div>
        <div class="meter"><b id="meter"></b></div>
        <div class="quad">
          <div><span class="lbl">Entradas del mes</span><span class="num" id="tin"></span></div>
          <div><span class="lbl">Resultado</span><span class="num" id="saldo"></span></div>
        </div>
        <small id="sub2"></small>
      </section>
      <form class="box" id="frm" autocomplete="off">
        <h2 id="ftitle">Cargar movimiento</h2>
        <div class="s" id="flibro"></div>
        <div class="seg" id="tipos"></div>
        <label>Monto ($)<input class="amount" id="monto" inputmode="decimal" placeholder="0"></label>
        <label>Categoría<select id="categoria"></select></label>
        <label id="lconcepto">Concepto<select id="concepto"></select></label>
        <label id="llibre">Concepto (opcional)<input id="libre" maxlength="60" placeholder="Escribí el concepto"></label>
        <label id="llugar">Casa<select id="lugar"></select></label>
        <div id="internet" class="s" hidden></div>
        <label id="lbanco">Banco<select id="banco"></select></label>
        <label id="lbancolibre">Banco (opcional)<input id="bancolibre" maxlength="40" placeholder="Ej: Banco Galicia"></label>
        <label id="lprov">Proveedor (opcional)<select id="prov"></select></label>
        <label id="lprovlibre">¿Qué proveedor?<input id="provlibre" maxlength="40"></label>
        <label><span id="tnota">Nota (opcional)</span><input id="detalle" maxlength="60" placeholder="Ej: factura de septiembre"></label>
        <div id="westado"><div style="font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:6px">Estado</div><div class="seg" id="estado"></div></div>
        <label class="chk" id="lrepite"><input type="checkbox" id="repite"> <span>Se repite todos los meses</span></label>
        <label class="chk" id="lhabil"><input type="checkbox" id="habil"> <span>El último día hábil de cada mes</span></label>
        <div class="seg" id="durac"></div>
        <label id="lcuotas"><span id="tcuotas">¿Cuántas cuotas? (contando esta)</span><input id="cuotas" inputmode="numeric" maxlength="3" placeholder="Ej: 12"></label>
        <label id="wfecha"><span id="lfecha">Fecha</span><input type="date" id="fecha"></label>
        <div class="err" id="ferr"></div>
        <div style="display:flex;gap:8px"><button type="button" class="btn del" id="fborrar" hidden>Borrar</button><button type="button" class="btn" id="cancel" hidden>Cancelar</button><button class="btn pri" style="flex:1;padding:12px">Guardar</button></div>
      </form>
    </div>
    <div class="col">
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div class="list" id="view"></div>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

const fb = initializeApp({
  apiKey: "AIzaSyAZrnPWWYojUPVE4K7PMnrMNcj7HwcmZe8",
  authDomain: "mis-cuentas-pato.firebaseapp.com",
  projectId: "mis-cuentas-pato",
  storageBucket: "mis-cuentas-pato.firebasestorage.app",
  messagingSenderId: "66740200346",
  appId: "1:66740200346:web:aadf9a1040ed942a681023",
});
const auth = getAuth(fb), db = getFirestore(fb);

/* Listas: libro → tipo → categoría → conceptos (igual que Arbol.kt en el celu) */
const OTRO = "Otro";
const LIBROS = [["personal","Personal"],["negocio","Negocio"]];
const CASAS = ["Casa Yofre","Casa Mercedes","Casa Corrientes"];
const PROVEEDORES = ["Celta SRL","Amado Electricidad","Electricidad Total","Ayala Electricidad","INEA"];
const BANCOS = ["Banco Nación","Banco de Corrientes"];
const INTERNET = {"Casa Mercedes":"Wireless","Casa Yofre":"Starlink","Casa Corrientes":"Flow"};
const ULTIMO_HABIL = 0;
const ARBOL = {
  personal: {
    egreso: {
      "Servicios": {c:["Luz","Agua","Internet","Celular"], casa:true},
      "Empleados": {c:["Niñera","Empleada","Jardinero"], casa:true},
      "Mantenimiento": {c:[], casa:true},
      "Vehículos": {c:["Combustible","Service"]},
      "Comida / Súper": {c:[]}, "Chicos": {c:[]}, "Educación": {c:[]}, "Salud": {c:[]}, "Salidas": {c:[]},
      "Créditos": {c:["Vehículo","Refinanciación de deuda","Electrodomésticos","Personal"]},
      "Deudas": {c:["Tarjeta","Impuestos"]},
      "Otros": {c:[]},
    },
    ingreso: {
      "Sueldo": {c:["Sueldo","Aguinaldo","Bono"]},
      "Otros": {c:["Alquileres","Reintegros"]},
    },
  },
  negocio: {
    egreso: {
      "Local": {c:["Alquiler"]},
      "Proveedores": {c:PROVEEDORES},
      "Sueldos": {c:[]}, "Publicidad": {c:[]}, "Página web": {c:[]},
      "Cheques a pagar": {c:[]}, "Impuestos": {c:[]}, "Otros": {c:[]},
    },
    ingreso: {
      "Ventas del día": {c:["Efectivo","Transferencia","Tarjeta","Mercado Pago"]},
      "Cheques a cobrar": {c:[]}, "Cuenta corriente": {c:[]}, "Otros": {c:[]},
    },
  },
};
const rama = (l,t) => (ARBOL[l]||{})[t] || {};
const categorias = (l,t) => Object.keys(rama(l,t));
const conceptos = (l,t,c) => (rama(l,t)[c]||{}).c || [];
const pideCasa = (l,t,c) => !!(rama(l,t)[c]||{}).casa;
/* Qué datos extra pide cada categoría: "obl" obligatorio, "opc" opcional */
function extraDe(l,t,c){
  if(l==="negocio"&&t==="egreso"&&c==="Cheques a pagar") return {prov:"opc", banco:"obl"};
  if(l==="negocio"&&t==="ingreso"&&c==="Cheques a cobrar") return {banco:"opc", libre:true};
  return {};
}
/* A qué libro pertenece algo cargado antes de la separación */
function libroViejo(tipo, ambito, cat, con){
  const n = ambito==="Negocio" || ["Negocio","Local","Marketing","Proveedores","Ventas del día","Cheques a cobrar","Cuenta corriente",
    "Cheque","Transferencia","Cobro de cheque","Cobro de cuenta corriente","Cheques a pagar","Cheque cobrado"].includes(cat)
    || ["Sueldos","Cheques a pagar","Cheque emitido","Publicidad","Página web"].includes(con) || (tipo==="ingreso" && cat.startsWith("Negocio"));
  return n ? "negocio" : "personal";
}
const lugarDe = m => CASAS.includes(m.ambito) ? m.ambito : "General";

const $ = s => document.querySelector(s);
const fmt = n => new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => iso(new Date());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fdate = s => s ? parse(s).toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"}) : "";
const ym = d => d.getFullYear()+"-"+pad(d.getMonth()+1);
const dias = s => Math.round((parse(s) - parse(today()))/86400000);
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(36).slice(2));
const h = (tag,cls,txt) => { const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
const semaforo = d => d<=1 ? "var(--rojo)" : d<=5 ? "var(--amarillo)" : "var(--verde)";
const textoVence = d => d < -1 ? `venció hace ${-d} días` : d===-1 ? "venció ayer" : d===0 ? "vence hoy" : d===1 ? "vence mañana" : `vence en ${d} días`;
const textoDia = dia => dia===ULTIMO_HABIL ? "Último día hábil de cada mes" : "Todos los días "+dia;
const sum = l => l.reduce((a,x)=>a+x.monto,0);

let inicio={};
let uid=null, crudos=[], fijos=[], unsubs=[], movsServ=false, fijosServ=false, plantillaRevisada=null;
let tab="mes", cur=new Date(); cur.setDate(1);
let libro = "personal"; try { libro = localStorage.getItem("libro") || "personal"; } catch(e){}
const f = { libro, tipo:"egreso", casa:"", prov:"", banco:"", categoria:null, concepto:null, pendiente:false, editMov:null, editFijo:null };

/* Lee un movimiento, convirtiendo los del formato viejo. */
function normalizar(id, m){
  let tipo=m.tipo, pend=!!m.pendiente;
  if(tipo==="deuda"||tipo==="cobro"){ if(m.pagado) return null; tipo = tipo==="deuda"?"egreso":"ingreso"; pend=true; }
  if(tipo!=="ingreso"&&tipo!=="egreso") return null;
  if(typeof m.monto!=="number"||!m.fecha) return null;
  const ambito=m.ambito||"", categoria=m.categoria||"", concepto=m.concepto||"";
  return { id, tipo, monto:m.monto, ambito, categoria, concepto, fecha:m.fecha,
    pendiente:pend, detalle:m.detalle||"", creado:m.creado||0, fijoId:m.fijoId||null, anulado:!!m.anulado,
    proveedor:m.proveedor||"", banco:m.banco||"", libro: m.libro || libroViejo(tipo,ambito,categoria,concepto) };
}
const normalizarFijo = (id,m) => ({ id, ...m, libro: m.libro || libroViejo(m.tipo,m.ambito||"",m.categoria||"",m.concepto||"") });
const movs = () => crudos.filter(m=>!m.anulado);
const aMapa = m => { const {id,...r}=m; return r; };

const movsCol = () => collection(db,"users",uid,"movs");
const fijosCol = () => collection(db,"users",uid,"fijos");
const guardar = m => setDoc(doc(movsCol(),m.id), aMapa(m));
const borrar = m => m.fijoId ? guardar({...m, anulado:true}) : deleteDoc(doc(movsCol(),m.id));

/* ---------- fijos ---------- */
function diaDelMes(dia, mesYm){
  const [y,m]=mesYm.split("-").map(Number); const ult=new Date(y,m,0).getDate();
  if(dia!==ULTIMO_HABIL) return Math.min(Math.max(dia,1),ult);
  let d=new Date(y,m-1,ult); while(d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()-1); return d.getDate();
}
const fechaDelMes = (fj, mesYm) => mesYm+"-"+pad(diaDelMes(fj.dia, mesYm));
/* Cuotas: número de cuota de un mes (1 = mes de inicio) y si corresponde generarla */
const numeroCuota = (fj, mesYm) => { const [a,b]=fj.desde.split("-").map(Number), [c,d]=mesYm.split("-").map(Number); return (c-a)*12+(d-b)+1; };
const aplica = (fj, mesYm) => { const n=numeroCuota(fj,mesYm); return n>=1 && (!(fj.cuotas>0) || n<=fj.cuotas); };
const ultimoMes = fj => { if(!(fj.cuotas>0)) return null; const [a,b]=fj.desde.split("-").map(Number); return ym(new Date(a,b-1+fj.cuotas-1,1)); };
const instancia = (fj, mesYm, pendiente=true) => ({ id:`f_${fj.id}_${mesYm}`, tipo:fj.tipo, monto:fj.monto, ambito:fj.ambito||"", categoria:fj.categoria,
  concepto:fj.concepto, fecha:fechaDelMes(fj,mesYm), pendiente, detalle:[fj.detalle||"", fj.cuotas>0?`Cuota ${numeroCuota(fj,mesYm)} de ${fj.cuotas}`:""].filter(Boolean).join(" · "),
  creado:Date.now(), fijoId:fj.id, anulado:false,
  proveedor:fj.proveedor||"", banco:fj.banco||"", libro:fj.libro });
function mesesAGenerar(fj){
  const hoy=new Date(); const este=ym(hoy); const sig=ym(new Date(hoy.getFullYear(),hoy.getMonth()+1,1));
  const meses=[este]; const lim=new Date(hoy); lim.setDate(lim.getDate()+7);
  if(parse(fechaDelMes(fj,sig)) <= lim) meses.push(sig);
  return meses.filter(m=>aplica(fj,m));
}
/* Fijos del negocio que Pato pidió tener cargados de entrada; se crean una sola vez por cuenta (igual que en el celu). */
async function cargarPlantilla(){
  if(plantillaRevisada===uid) return; plantillaRevisada=uid;
  const mes=ym(new Date());
  const nuevos=[
    {id:"plantilla_alquiler", libro:"negocio", tipo:"egreso", monto:1000000, ambito:"", categoria:"Local", concepto:"Alquiler", dia:1, detalle:"Incluye internet", desde:mes, proveedor:"", banco:""},

/* Un renglón por grupo: lo ya pagado (o cobrado) y lo que falta */
function lineas(l, clave){
  const m={}; l.forEach(x=>{ const k=clave(x); m[k]=m[k]||{n:k,hecho:0,falta:0,movs:[]}; m[k][x.pendiente?"falta":"hecho"]+=x.monto; m[k].movs.push(x); });
  Object.values(m).forEach(g=>g.movs.sort((a,b)=>a.fecha.localeCompare(b.fecha)));
  return Object.values(m).sort((a,b)=>(b.hecho+b.falta)-(a.hecho+a.falta));
}
const abiertos=new Set();
function barras(titulo, lista, ingreso=false){
  const box=h("div","box"); box.append(h("div","day",titulo));
  const max=Math.max(...lista.map(x=>x.hecho+x.falta),0);
  lista.forEach(x=>{ const clave=titulo+"|"+x.n; const abierto=abiertos.has(clave);
    const b=h("div","bar"+(ingreso?" in":""));
    const tg=h("button","btn mas",abierto?"−":"+"); tg.type="button"; tg.title=abierto?"Ocultar detalle":"Ver detalle";
    tg.onclick=()=>{ abierto?abiertos.delete(clave):abiertos.add(clave); render(); };
    const nom=h("span","nom"); nom.append(tg, h("span","",x.n));
    b.append(nom,h("span","num",fmt(x.hecho+x.falta)));
    const i=h("i"); const bh=h("b"); bh.style.width=(max?x.hecho/max*100:0)+"%"; const bf=h("b","falta"); bf.style.width=(max?x.falta/max*100:0)+"%"; i.append(bh,bf); b.append(i);
    b.append(h("small","", (ingreso?"Cobrado ":"Pagado ")+fmt(x.hecho)+(x.falta?" · Falta "+fmt(x.falta):"")));
    if(abierto){ const d=h("div","detalle"); x.movs.forEach(m=>d.append(row(m))); b.append(d); }
    box.append(b); });
  return box;
}
/* Línea de tiempo de lo que falta pagar: por fecha, cuánto vence y cuánto se lleva acumulado */

  const porDia={}; pend.filter(m=>m.tipo==="egreso").forEach(m=>{ (porDia[m.fecha]=porDia[m.fecha]||[]).push(m); });
  const fechas=Object.keys(porDia).sort();
  if(!fechas.length){ box.append(h("div","s","No queda nada por pagar este mes.")); return box; }
  const tl=h("div","timeline"); let acum=0;
  fechas.forEach(fe=>{ const l=porDia[fe], tot=sum(l); acum+=tot; const d=dias(fe);
    const it=h("div","tl"); it.style.setProperty("--c",semaforo(d));
    const top=h("div","tltop"); top.append(h("span","tlf",fdate(fe)+" · "+textoVence(d)), h("span","num",fmt(tot)));
    it.append(top, h("div","s",l.map(m=>m.concepto).join(" · ")), h("div","s","Acumulado a pagar: "+fmt(acum))); tl.append(it); });
  box.append(tl); return box;
}
function donde(x){ return [x.categoria!==x.concepto?x.categoria:"", CASAS.includes(x.ambito)?x.ambito:""].filter(Boolean).join(" · "); }
function botonBorrar(fn){ const d=h("button","btn del","Borrar"); d.onclick=()=>{ if(d.dataset.sure) fn(); else { d.dataset.sure=1; d.textContent="¿Seguro?"; setTimeout(()=>{delete d.dataset.sure; d.textContent="Borrar";},3000); } }; return d; }
function row(x){
  const r=h("div","row"+(x.pendiente?"":" pagado")); const ing=x.tipo==="ingreso"; const d=dias(x.fecha);
  r.style.setProperty("--franja", x.pendiente ? semaforo(d) : ing ? "var(--in)" : "var(--out)");
  const t=h("div","txt"); t.append(h("div","c",(x.pendiente?"":"✓ ")+x.concepto));
  const prov = x.proveedor && x.proveedor!==x.concepto ? x.proveedor : "";
  const sub=[donde(x),x.banco,prov,x.detalle].filter(Boolean).join(" · "); if(sub) t.append(h("div","s",sub));
  if(x.pendiente) t.append(h("div","vence",textoVence(d)+" · "+fdate(x.fecha)));
  r.append(t, h("div","num amt "+x.tipo,(ing?"+":"−")+fmt(x.monto)));
  const a=h("div","acts");
  if(x.pendiente){ const p=h("button","btn pri", ing?"Lo cobré":"Lo pagué"); p.onclick=()=>guardar({...x,pendiente:false,fecha:today()}); a.append(p); }
  const e=h("button","btn","Editar"); e.onclick=()=>cargarEnForm(x,false); a.append(e);
  if(x.pendiente) a.append(botonBorrar(()=>borrar(x)));
  r.append(a); return r;
}
function rowFijo(fj){
  const r=h("div","row"); const ing=fj.tipo==="ingreso"; r.style.setProperty("--franja", ing?"var(--in)":"var(--out)");
  const t=h("div","txt"); t.append(h("div","c",fj.concepto));
  const prov = fj.proveedor && fj.proveedor!==fj.concepto ? fj.proveedor : "";
  const s=[donde(fj),fj.banco,prov,fj.detalle].filter(Boolean).join(" · "); if(s) t.append(h("div","s",s)); const um=ultimoMes(fj); t.append(h("div","s",textoDia(fj.dia)+(um?` · Cuota ${Math.min(Math.max(numeroCuota(fj,ym(new Date())),1),fj.cuotas)} de ${fj.cuotas} · termina en ${parse(um+"-01").toLocaleDateString("es-AR",{month:"long",year:"numeric"})}`:"")));
  r.append(t, h("div","num amt "+fj.tipo,(ing?"+":"−")+fmt(fj.monto)));
  const a=h("div","acts"); const e=h("button","btn","Editar"); e.onclick=()=>cargarEnForm(fj,true); a.append(e, botonBorrar(()=>borrarFijo(fj)));
  r.append(a); return r;
}

$("#hprev").onclick=()=>{cur.setMonth(cur.getMonth()-1); render();};
$("#hnext").onclick=()=>{cur.setMonth(cur.getMonth()+1); render();};
resetForm();
</script>
